[project]
name = "todo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
todo = "todo.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".loop"]

[tool.ruff.lint]
extend-select = ["I"]
